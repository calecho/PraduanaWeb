<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil - PRADUANA</title>
    <style>
        *{box-sizing:border-box;font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif}body{margin:0;background:#111;color:#fff;line-height:1.6}
        header{padding:22px;text-align:center;background:linear-gradient(90deg,#8b1e14,#d94a2b,#f5b942);box-shadow:0 4px 12px #0006}header a{color:#fff;text-decoration:none;font-size:28px;font-weight:700;letter-spacing:2px}
        .contenedor{width:1000px;max-width:92%;margin:40px auto 80px}.perfil{display:flex;align-items:center;gap:22px;padding:28px;background:#1d1d1d;border:1px solid #444;border-radius:14px}.silueta{width:76px;height:76px;flex:0 0 76px;border-radius:50%;background:#f5b942;color:#8b1e14;display:grid;place-items:center;font-size:36px}.perfil h1{margin:0;color:#ffd37a}.perfil p{margin:5px 0;color:#ddd}.estado{color:#7ee2a8!important;font-weight:700}.venta{color:#ffd37a!important;font-weight:700}.vendido{color:#ff9a8f!important;font-weight:700}.imagenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px;margin-top:28px}.card{display:block;color:#fff;text-decoration:none;background:#1d1d1d;border:1px solid #444;border-radius:12px;overflow:hidden}.card:hover{border-color:#f5b942}.card img{width:100%;height:190px;object-fit:cover;object-position:center 78%;background:#222}.card div{padding:16px}.card h2{font-size:20px;color:#ffd37a;margin:0 0 8px}.card p{margin:5px 0;color:#ddd}.volver{display:inline-block;margin-top:28px;color:#ffd37a}.no-encontrado{text-align:center;padding:80px 0}.no-encontrado a{color:#ffd37a}
    </style>
</head>
<body>
    <header><a href="index.html">PRADUANA</a></header>
    <main class="contenedor" id="contenido"></main>
    <script src="datos-demo.js"></script>
    <script>
        const usuario = obtenerUsuarioDemo(new URLSearchParams(window.location.search).get('id'));
        const contenido = document.getElementById('contenido');
        if (!usuario) {
            contenido.innerHTML = '<div class="no-encontrado"><h1>Perfil no encontrado</h1><p>El usuario ya no está disponible.</p><a href="index.html">Volver a PRADUANA</a></div>';
        } else {
            const publicaciones = publicacionesDemo.filter(item => item.usuario_id === usuario.id);
            document.title = `${usuario.nombre} - PRADUANA`;
            const tieneVentas = publicacionesDemo.some(item => item.usuario_id === usuario.id && item.vendido);
            contenido.innerHTML = `
                <section class="perfil"><div class="silueta">&#128100;</div><div><h1>${usuario.nombre}</h1><p>${usuario.correo}</p><p>Miembro desde ${usuario.fecha_registro}</p><p class="${tieneVentas ? 'venta' : 'estado'}">${tieneVentas ? '✓ Este usuario ya ha realizado ventas en PRADUANA' : 'Vendedor activo en PRADUANA'}</p></div></section>
                <h2>Publicaciones de ${usuario.nombre}</h2>
                <section class="imagenes">${publicaciones.map(publicacion => `
                    <a class="card" href="publicacion.html?id=${publicacion.id}"><img src="${publicacion.imagen}" alt="${publicacion.nombre}"><div><h2>${publicacion.nombre}</h2><p>${publicacion.raza} · ${publicacion.ubicacion}</p><p>$${formatoPrecioDemo(publicacion.precio)} COP</p><p class="${publicacion.vendido ? 'vendido' : 'estado'}">${publicacion.vendido ? '✓ Vendido' : '✓ Disponible'}</p></div></a>
                `).join('')}</section>
                <a class="volver" href="index.html#ganado">← Volver a PRADUANA</a>
            `;
        }
    </script>
</body>
</html>
